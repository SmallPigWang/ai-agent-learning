# mypy 配置
[mypy]
mypy_path = scripts/phase2-agent:scripts/phase3-rag

# 这三个包住在 torch_env / .tools（运行时自举挂载），静态环境看不见——豁免
[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
